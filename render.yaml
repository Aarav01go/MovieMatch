services:
  - type: web
    name: moviematch-backend
    runtime: python
    region: singapore
    plan: free
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --app-dir backend --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHONPATH
        value: backend:.
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        value: sqlite:///backend/data/moviematch.db
      - key: OPENROUTER_KEY
        sync: false
      - key: OMDB_API_KEY
        value: thewdb
